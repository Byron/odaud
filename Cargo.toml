[package]
name = "odaud"
version = "0.1.0"
edition = "2024"
rust-version = "1.85"
description = "On-demand macOS stereo output with per-device delay compensation"

[dependencies]
serde = { version = "1.0.229", features = ["derive"] }
toml = { version = "1.1.8", default-features = false, features = ["std", "serde", "parse"] }


